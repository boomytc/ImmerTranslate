name: release checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check origin/main
      - run: pnpm release:check
      - run: pnpm test:release
      - run: pnpm test --watchAll=false --runInBand
        env:
          CI: "true"
      - run: pnpm build+zip
      - run: git diff --exit-code
      - run: pnpm release:artifacts
